<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de inglês</title>
<meta name="theme-color" content="#0a4a31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de inglês">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --wash:#eef8f1; --felt:#0f7b4f; --felt-deep:#0a4a31; --ink:#14211b; --muted:#5b6b63;
  --line:#d6e6dc; --token:#f2b705; --stop:#c8372d; --r-s:8px; --r-l:16px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,.num{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:700;margin-bottom:.6rem}
h3{font-size:1.02rem;font-weight:500}
p{margin:.3rem 0}
.wrap{max-width:1040px;margin:0 auto;padding:1.25rem 1rem 3rem}
header.top{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:flex-end;justify-content:space-between;margin-bottom:1.25rem}
.sub{color:var(--muted);max-width:60ch}
.sync{font-size:.82rem;color:var(--muted);margin-top:.35rem}
.who input{width:132px;font-weight:600}
.who .row{gap:.5rem}

/* trilha de tabuleiro: o único elemento chamativo */
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 1.25rem;padding:10px;background:var(--felt);border-radius:var(--r-l)}
.sq{position:relative;background:var(--paper);border-radius:10px;padding:.6rem .6rem .7rem;min-height:92px;border:2px solid transparent}
.sq.done{background:#d9efe2}
.sq.cur{border-color:var(--token);box-shadow:0 0 0 3px rgba(242,183,5,.35)}
.sq .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.5rem;color:var(--felt-deep)}
.sq .lv{font-size:.8rem;color:var(--muted)}
.sq .t{font-size:.86rem;font-weight:500}
.pawn{position:absolute;right:8px;top:8px;width:20px;height:26px}


nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:1.25rem;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;padding:.6rem .95rem;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--felt-deep);border-bottom-color:var(--felt)}
:focus-visible{outline:3px solid var(--token);outline-offset:2px}

.grid{display:grid;gap:1rem}
@media(min-width:760px){.g2{grid-template-columns:1.15fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.panel{border:1px solid var(--line);border-radius:var(--r-l);padding:1rem 1.1rem}
.panel.soft{background:var(--wash);border-color:transparent}
.big{font-size:2rem;font-weight:700;color:var(--felt-deep)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--felt);border-radius:99px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:.6rem 0}
.day{border:1px solid var(--line);border-radius:var(--r-s);padding:.45rem .2rem;text-align:center;font-size:.8rem;color:var(--muted)}
.day b{display:block;font-size:1rem;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.day.on{background:var(--felt);border-color:var(--felt);color:#dff3e7}.day.on b{color:#fff}
.day.today{border-color:var(--felt-deep);border-width:2px}

button.btn,a.btn{font:inherit;font-weight:600;display:inline-block;text-decoration:none;border-radius:var(--r-s);padding:.55rem .9rem;border:1.5px solid var(--felt);background:var(--felt);color:#fff;cursor:pointer}
button.btn.ghost,a.btn.ghost{background:transparent;color:var(--felt-deep)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.link{font:inherit;background:none;border:0;color:var(--stop);cursor:pointer;padding:0;text-decoration:underline;font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.4rem 0}
.chip{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:.3rem .75rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--felt-deep);border-color:var(--felt-deep);color:#fff}
input,select{font:inherit;border:1.5px solid var(--line);border-radius:var(--r-s);padding:.45rem .55rem;background:#fff;color:var(--ink);max-width:100%}
label{font-size:.86rem;color:var(--muted);display:block;margin-bottom:.15rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:.5rem 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:0}

.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem .8rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.game .meta{font-size:.84rem;color:var(--muted)}
.tag{display:inline-block;font-size:.76rem;border-radius:6px;padding:.05rem .4rem;background:var(--wash);color:var(--felt-deep);margin-right:4px}
.tag.warn{background:#fdf1cf;color:#6b4e00}
.game .links a{font-size:.84rem;color:var(--felt-deep);margin-right:.7rem}
.game .ctl{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.game .ctl input{width:92px}
@media(max-width:560px){.game{grid-template-columns:1fr}.game .ctl{justify-content:flex-start}}
.next{border-left:4px solid var(--token);padding-left:.7rem}

.score{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pl{text-align:center;border:1px solid var(--line);border-radius:var(--r-l);padding:1rem .6rem}
.pl .pts{font-family:"Bricolage Grotesque",sans-serif;font-size:3rem;font-weight:700;color:var(--felt-deep);line-height:1}
.pl .adds{display:flex;gap:6px;justify-content:center;margin-top:.6rem;flex-wrap:wrap}
.pl .adds button{min-width:52px}
label.check{display:flex;gap:.55rem;align-items:flex-start;color:var(--ink);font-size:.95rem;padding:.35rem 0;cursor:pointer}
label.check input{margin-top:.25rem;width:18px;height:18px;accent-color:var(--felt)}
details{border-top:1px solid var(--line);padding:.6rem 0}
summary{cursor:pointer;font-weight:600}


.btn.neg{border-color:var(--line);color:var(--stop)}
.pl .adds .btn{font-size:.88rem;padding:.5rem .6rem}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
@media(max-width:560px){.drow{grid-template-columns:1fr}}
#tleft{min-width:2.5ch}

details.stg{border:1px solid var(--line);border-radius:var(--r-l);padding:.2rem 1rem;margin-bottom:.6rem}
details.stg[open]{background:#fff;border-color:var(--felt)}
details.stg summary{padding:.7rem 0;font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem}
.sn{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:8px;background:var(--felt);color:#fff;font-weight:700;margin-right:.35rem}
.stgb{padding:0 0 1rem;max-width:80ch}
.chip.has{background:var(--wash);border-color:var(--felt);color:var(--felt-deep)}
ul.ok{margin:.2rem 0 .6rem;padding-left:1.2rem}
.fix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:.3rem 1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.fix .sym{font-weight:600;color:var(--stop)}
@media(max-width:620px){.fix{grid-template-columns:1fr}}

.gstep{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;border-top:1px solid #cfe6d8;padding:.25rem 0}
.gstep .chip{flex:none;margin-top:.3rem;font-size:.8rem}
ol.rules{margin:0;padding-left:1.2rem}ol.rules li{padding:.35rem 0}
.how{border-top:1px solid var(--line);padding:.9rem 0;max-width:78ch}
.how h3{margin-bottom:.3rem}
.phr .ph{display:flex;justify-content:space-between;gap:.6rem;align-items:center;padding:.3rem 0}
.phr .ph span{font-weight:500}
.phr .chip{font-size:.78rem;padding:.15rem .6rem;flex:none}
@media(min-width:760px){.phr.two{columns:2;column-gap:1.5rem}.phr.two .ph{break-inside:avoid}}

.ts{display:none}
body{overflow-wrap:break-word}
.row>div{min-width:0}
@media(max-width:640px){
  .wrap{padding:.75rem .75rem 2.5rem}
  header.top{margin-bottom:.8rem;gap:.5rem}
  .sub{display:none}
  h1{font-size:1.45rem}
  .who{width:100%}
  .who .row>div{flex:1}
  .who input{width:100%}
  /* trilha compacta: cabe na tela, sem rolagem lateral */
  .track{gap:4px;padding:6px;border-radius:12px;margin-bottom:.8rem}
  .sq{min-height:0;padding:.35rem .25rem .4rem;text-align:center;border-radius:8px}
  .sq .n{font-size:1.15rem}
  .sq .t{display:none}
  .sq .lv{font-size:.66rem;line-height:1.2}
  .sq.cur .t{display:none}
  .pawn{width:12px;height:16px;right:3px;top:3px}

  h2{font-size:1.15rem}
  .panel{padding:.85rem .85rem;border-radius:12px}
  .big{font-size:1.6rem}
  /* alvos de toque */
  .chip{min-height:40px;padding:.4rem .8rem}
  button.btn,a.btn{min-height:44px;padding:.6rem .9rem}
  button.link{padding:.4rem 0;font-size:.9rem}
  input,select{min-height:44px}
  input[type=checkbox],input[type=file]{min-height:0}
  label.check{padding:.5rem 0}
  label.check input{width:22px;height:22px}
  details summary{padding:.6rem 0}
  /* semana */
  .week{gap:4px}.day{padding:.4rem 0;font-size:.72rem}.day b{font-size:.95rem}
  /* resumo de compras */
  .g3.stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .g3.stats .panel{padding:.55rem .4rem;text-align:center}
  .g3.stats .big{font-size:1.05rem;display:block}
  .g3.stats .small{font-size:.72rem;line-height:1.2;display:block}
  /* lista de jogos */
  .game .ctl select{flex:1;min-width:0}
  .game .ctl input{width:104px}
  .game .links a{display:inline-block;padding:.45rem 0;margin-right:1rem;font-size:.92rem}
  /* placar: os dois jogadores lado a lado, botões empilhados */
  .score{gap:8px}
  .pl{padding:.7rem .4rem;border-radius:12px}
  .pl .pts{font-size:2.4rem}
  .pl .adds{flex-direction:column;gap:6px;margin-top:.5rem}
  .pl .adds .btn{width:100%;min-height:46px;font-size:.86rem;padding:.4rem .3rem}
  .phr .chip{min-height:38px;padding:.3rem .8rem;font-size:.84rem}
  .phr .ph{padding:.45rem 0}
  .gstep{flex-wrap:wrap}
  .gstep .chip{margin:0 0 .4rem 2rem}
  details.stg{padding:.1rem .75rem;border-radius:12px}
  details.stg summary{font-size:.98rem}
  .sn{width:1.6rem;height:1.6rem}
}
@media(max-width:360px){.pl .adds .btn{font-size:.8rem}}

nav.tabs button{display:flex;align-items:center;gap:.4rem}
button.sq{font:inherit;text-align:left;cursor:pointer;color:inherit}
.intro{margin:0 0 1rem;max-width:70ch}
.intro h2{font-size:1.5rem;margin-bottom:.2rem}
.intro p{color:var(--muted)}
.cta{background:var(--felt-deep);color:#fff;border-radius:var(--r-l);padding:1.1rem 1.2rem}
.cta h3{font-size:1.3rem;font-weight:700;margin:.1rem 0 .3rem;color:#fff}
.cta .small{color:#bfe3cf}
.cta p{color:#e6f4ec;max-width:60ch}
.btn.inv{background:#fff;color:var(--felt-deep);border-color:#fff;margin-top:.7rem}
.steph{display:flex;gap:.7rem;align-items:flex-start;margin:1.6rem 0 .6rem}
.steph h3{font-size:1.3rem;font-weight:700}
.panel h2{font-size:1.12rem}
.steph .sn{flex:none;width:2.1rem;height:2.1rem;font-size:1.1rem;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--felt-deep);border-radius:12px;overflow:hidden;margin:.2rem 0 .8rem;max-width:480px}
.seg button{font:inherit;font-weight:600;border:0;background:#fff;color:var(--felt-deep);padding:.7rem .5rem;cursor:pointer;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--felt-deep);color:#fff}
.okmsg{background:var(--wash);border-left:4px solid var(--felt);padding:.6rem .8rem;border-radius:8px;margin:0 0 1rem;font-weight:500}
.clean li .chip{margin-left:.4rem;font-size:.8rem}
@media(max-width:640px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;background:#fff;border-top:1px solid var(--line);border-bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 14px -10px rgba(10,74,49,.4)}
  nav.tabs button{flex-direction:column;gap:2px;justify-content:center;border:0;margin:0;padding:.35rem 0;font-size:.72rem;min-height:54px;border-radius:10px;color:var(--muted)}
  nav.tabs button[aria-selected="true"]{background:var(--wash);color:var(--felt-deep);border:0}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .intro h2{font-size:1.3rem}
  .cta{padding:.95rem 1rem;border-radius:12px}
  .steph{margin-top:1.3rem}
  .seg{max-width:none}
  button.sq{text-align:center}
  #trackcap{margin-top:-.4rem !important}
}

.exbox{background:var(--wash);border-radius:12px;padding:.8rem .9rem;margin-top:.8rem}
.exrow{display:flex;gap:.6rem;align-items:flex-start;padding:.3rem 0}
.pt{flex:none;display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:#fff}
.pt.p1{background:var(--felt)}.pt.p2{background:var(--felt-deep)}
.sline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.6rem;margin:.4rem 0}
.sline>div{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:12px;border:2px solid transparent}
.sline>div:last-child{justify-content:flex-end}
.sline>div.on{border-color:var(--token);background:#fff8dc}
.sline b{font-size:2.2rem;color:var(--felt-deep);line-height:1}
.sline span{font-weight:600}
.sline i{font-style:normal;color:var(--muted)}
.turn{font-size:1.05rem;margin:.6rem 0}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 button{font:inherit;cursor:pointer;border-radius:14px;padding:.9rem .5rem;min-height:84px;display:flex;flex-direction:column;gap:.2rem;align-items:center;justify-content:center;text-align:center;border:2px solid}
.big3 button b{font-size:1rem;line-height:1.2}.big3 button span{font-size:.85rem;opacity:.85}
.big3 .b0{background:#fff;border-color:var(--line);color:var(--stop)}
.big3 .b1{background:var(--wash);border-color:var(--felt);color:var(--felt-deep)}
.big3 .b2{background:var(--felt-deep);border-color:var(--felt-deep);color:#fff}
.endbox{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.endbox.hot{background:#fff8dc;border:2px solid var(--token);border-radius:12px;padding:1rem}
@media(max-width:640px){.big3{grid-template-columns:1fr}.big3 button{min-height:62px;flex-direction:row;justify-content:space-between;padding:.7rem 1rem}.sline b{font-size:1.9rem}.sline>div{padding:.4rem .5rem;gap:.4rem}.sline span{font-size:.9rem}}

.star{color:var(--token);font-size:.8em}

.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.2rem;background:var(--felt-deep)}
.gatebox{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:1.6rem 1.4rem}
.gatebox h1{margin-bottom:.3rem}
.gatebox .btn{margin-top:.6rem;min-height:48px}
.lerr{color:var(--stop);font-weight:500;margin:.3rem 0 0}
.lerr:empty{display:none}
#acct button{font:inherit;font-size:.82rem;background:none;border:0;color:var(--felt-deep);text-decoration:underline;cursor:pointer;padding:.2rem 0}
[hidden]{display:none !important}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

/* ---- flashcard instrução com audio ---- */
.fc-instr{display:flex;gap:.6rem;align-items:start;background:var(--wash);border-radius:8px;padding:.7rem .8rem;margin-bottom:.6rem}
.fc-instr .play-btn{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:none;background:var(--felt-deep);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
.fc-instr .play-btn:hover{background:#083d26}
.fc-instr .play-btn:active{transform:scale(.92)}
.fc-instr .play-btn.speaking{background:var(--stop);animation:pulse-ring 1s infinite}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(200,55,45,.4)}50%{box-shadow:0 0 0 8px rgba(200,55,45,0)}}
.fc-instr .fc-text{font-size:.88rem;color:var(--felt-deep);line-height:1.5}
.fc-instr .fc-text b{color:var(--ink)}
.fc-instr .fc-text .fc-step{display:block;margin-top:.3rem}
.fc-instr .fc-text .pts-line{display:inline-flex;align-items:center;gap:.3rem}
.fc-instr .fc-text .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fc-instr .fc-text .dot.g{background:var(--felt-deep)}
.fc-instr .fc-text .dot.b{background:#1a6b4a}
.fc-instr .fc-text .dot.r{background:var(--stop)}

/* ---- game chips (jogo de caixa) ---- */
.game-grid{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0}
.game-chip{font:inherit;font-size:.82rem;font-weight:600;padding:.4rem .7rem;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.game-chip:hover{border-color:var(--felt-deep);color:var(--felt-deep)}
.game-chip[aria-pressed="true"]{background:var(--felt-deep);color:#fff;border-color:var(--felt-deep)}
.game-chip .rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.game-chip .rdot.A{background:var(--token)}.game-chip .rdot.P{background:var(--felt-deep)}.game-chip .rdot.C{background:#5b8def}
.game-chip[aria-pressed="true"] .rdot.P{background:#fff}
.role-legend{display:flex;gap:1rem;margin-top:.5rem;flex-wrap:wrap}
.role-legend span{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted)}
.role-legend .rld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.role-legend .rld.A{background:var(--token)}.role-legend .rld.P{background:var(--felt-deep)}.role-legend .rld.C{background:#5b8def}

/* ---- regra de hoje card ---- */
.regra-card{background:linear-gradient(135deg,var(--felt-deep),#062e1d);color:#fff;border-radius:16px;padding:1.25rem;margin-bottom:.75rem;box-shadow:0 2px 12px rgba(0,0,0,.18);position:relative;overflow:hidden}
.regra-card::before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.regra-card .rtag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.18);padding:.15rem .5rem;border-radius:10px}
.regra-card h3{font-size:1rem;margin:.4rem 0 .3rem}
.regra-card p{font-size:.92rem;line-height:1.55;margin:0;opacity:.92}
.regra-card .rex{margin-top:.6rem;background:rgba(255,255,255,.12);border-radius:8px;padding:.55rem .7rem}
.regra-card .rex-label{font-size:.78rem;opacity:.7;margin:0 0 .2rem;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.regra-card .rex-text{font-size:.92rem;margin:0;font-style:italic}

 "p-solve":{how:"Um lê o problema em voz alta, o outro dá 2 conselhos diferentes. Depois o primeiro diz qual conselho prefere e por quê. Invertam.",say:["You should...","If I were you, I would...","Why don't you...?","Have you tried...?","That's a good idea, but..."]},

 "e-travel":{t:"eli",say:["I'd like a ticket to...","Where is the station?","How much is it?","Can I see your passport?","Have a nice trip!"]},
 "e-quartet":{t:"eli",say:["Do you have the...?","Yes, here you are.","No, sorry.","I have a set!","It's your turn to ask."]},
 "e-fullstop":{how:"Monte a frase com as cartas, leia em voz alta e ponha o ponto final. O outro transforma: negativa ou pergunta. Frase errada que o adversário corrigir dá o ponto para ele.",say:["My sentence is...","Is it correct?","Make it negative.","Make it a question.","Full stop!"]},
 "e-five":{t:"eli",how:"Com as 5 cartas, conte uma história curta ligando as imagens. O outro recontar em 3 frases vale ponto extra.",say:["First...","Then...","After that...","Finally...","What happened next?"]},
 "e-emotions":{t:"eli",say:["I feel...","I felt nervous when...","How do you feel about...?","It makes me happy.","Why?"]},
 "e-idioms":{t:"eli",how:"Além da regra da caixa, cada expressão acertada só pontua se você usar numa frase verdadeira sobre a sua vida.",say:["It means...","For example...","It's a piece of cake.","I'm under the weather."]},
 "e-sayit":{t:"eli"},
 "c-guesswho":{how:"Só valem perguntas completas em inglês. Na fase 1 usem os moldes abaixo. Da fase 2 em diante, troquem a regra: em vez de perguntar, descreva a sua pessoa em 3 frases e o outro adivinha.",say:["Does your person have glasses?","Is your person a woman?","Does he have blond hair?","Is she wearing a hat?","Yes, he does. / No, she doesn't.","Is it...?"]},
 "c-zingo":{how:"Pegou a peça, fale a palavra. Da segunda sessão em diante, só leva a peça quem disser uma frase com ela.",say:["I need the...","I have it!","It's mine!","Zingo!"]},
 "c-battleship":{how:"Coordenadas sempre em inglês. É o melhor treino de alfabeto que existe: A, E e I confundem todo brasileiro. Na dúvida, o celular fala a letra.",say:["B seven.","Hit!","Miss!","You sank my battleship!","Say the letter again, please."]},

 "c-hedbanz":{how:"Só perguntas de sim ou não, completas. Na fase 3, quem responde não pode dizer só yes ou no: tem que dar uma pista em frase.",say:["Am I an animal?","Am I bigger than a dog?","Do I live in water?","Can I fly?","Do people eat me?","Am I a...?"]},
 "c-banana":{how:"Toda palavra formada tem que ser lida e usada numa frase no fim da rodada, senão volta para o monte. Palavra que ninguém conhece vai para o pote.",say:["Split!","Peel!","Bananas!","Is that a real word?","What does it mean?"]},
 "c-cubes":{how:"Uma frase por dado. Fase 2 no presente (There is a...), fase 3 no passado com conectores. O outro fecha a história com uma frase final.",say:["There is a...","Once upon a time...","And then...","But suddenly...","Because...","The end."]},

 "c-duet":{how:"Dica de uma palavra e um número, como na regra. O ganho de inglês vem depois de cada rodada: quem deu a dica explica o raciocínio em voz alta.",say:["My clue is ocean, two.","I said that because...","I'm not sure about this one.","Let's pass.","That was the assassin!"]},
 "c-justone":{how:"Depois de revelar as dicas, cada um explica a sua em uma frase. Melhor com 3 ou mais pessoas.",say:["My clue was...","I wrote that because...","We wrote the same word!","My guess is..."]},

 "c-wordup":{how:"Usem as cartas do nível de vocês e subam de nível quando acertarem 8 de cada 10. Toda resposta em frase completa.",say:["The answer is...","Can you repeat the question?","I'm not sure, but I think...","Correct!"]},
 "c-catan":{how:"Todo o inglês está na troca. Proibido trocar em silêncio: tem que pedir, oferecer, recusar e reclamar. Precisa de 3 ou mais pessoas para render.",say:["Does anyone have brick?","I'll give you two sheep for one ore.","No way.","That's a bad deal.","Can I build here?","I move the robber."]},
 "c-balder":{how:"Escrevam as definições falsas em inglês, leiam em voz alta e defendam a sua como se fosse a verdadeira.",say:["I think it means...","That sounds fake.","I vote for number two.","The real definition is..."]},
 "c-sherlock":{how:"Leiam o caso em voz alta, um parágrafo cada. Teorias só em inglês. Palavra desconhecida: tentem pelo contexto, só depois o celular, e ela vai para o pote. Um caso rende 2 a 3 sessões.",say:["I think the killer is... because...","Let's visit...","That doesn't make sense.","What if...?","We need more evidence."]},
 "c-unlock":{how:"Pensem em voz alta o tempo todo. O cronômetro força a fala rápida, sem tempo de montar a frase perfeita.",say:["Let's combine this with that.","Try the code...","What does this mean?","Look at this card.","We're running out of time!"]},
 "c-trivial":{how:"Quem pergunta lê em voz alta, quem responde usa frase completa. Errar o fato não importa, o que conta é entender a pergunta.",say:["I think it's...","I have no idea.","My guess is...","Can you read it again?","Correct!"]},
 "c-once":{how:"Contem a história com conectores e interrompam de verdade, como manda a regra. Interromper em inglês exige ouvir com atenção total.",say:["Once upon a time...","Wait, that reminds me...","Meanwhile...","And they lived happily ever after."]},
 "c-dnd":{how:"Descreva suas ações em primeira pessoa e pergunte tudo ao mestre. O ideal é uma mesa online com mestre nativo: são 3 horas de conversa real por sessão.",say:["I want to...","I search the room.","I try to persuade the guard.","What do I see?","Can I roll for that?"]},
 "c-heavy":{how:"A primeira sessão é ler o manual em inglês juntos, em voz alta, e explicar as regras um para o outro. Só isso já é uma aula inteira.",say:["How does this work?","According to the rules...","So, on my turn I can...","Let me check the rulebook."]}

function howOf(g){const h=HOW[g.id]||{};const t=TPL[h.t]||{};return{how:h.how||t.how||"Siga a regra da caixa com as regras da mesa por cima: frase completa, narrar a jogada e uma pergunta para o outro a cada rodada.",say:h.say||t.say||[]}}
const canSpeak=(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}})();
function speak(t){if(!canSpeak)return;try{const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g," "));u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let _speakingPT=false;
function speakPT(t,btn){if(!canSpeak)return;try{speechSynthesis.cancel();if(_speakingPT&&btn){_speakingPT=false;document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('speaking'));return}const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=.92;if(btn){btn.classList.add('speaking');_speakingPT=true}u.onend=u.onerror=()=>{_speakingPT=false;if(btn)btn.classList.remove('speaking')};speechSynthesis.speak(u)}catch(e){_speakingPT=false}}
function phrase(t){return `<li class="ph"><span lang="en">${esc(t)}</span>${canSpeak?`<button class="chip" data-act="say" data-v="${esc(t)}" aria-label="Ouvir: ${esc(t)}">Ouvir</button>`:""}</li>`}

function ladder(g){const n=plays(g.id);if(g.src==="F")return null;const ex=LADDER_EXAMPLES[g.id]||LADDER_EXAMPLES["c-uno"];if(n<2)return{rule:"Pode falar palavras soltas e frases curtas. Sem relógio.",goal:"O objetivo é só aprender a regra do jogo em inglês.",example:ex[0],level:1,n:n};if(n<4)return{rule:"Agora toda fala tem que ser frase completa + uma pergunta para o jogador.",goal:"Isso força você a montar frases de verdade, não só palavras.",example:ex[1],level:2,n:n};if(n<6)return{rule:"Mesmas regras, mas agora com relógio: 10 segundos por jogada.",goal:"Treina a velocidade — pensar em inglês sem traduzir do português.",example:ex[2],level:3,n:n};return{rule:"Esse jogo já ficou fácil. Use como aquecimento de 5 minutos.",goal:"Abra o próximo jogo da lista para continuar evoluindo.",example:null,level:4,n:n}}
function vComo(){
  const ph=ui.hPhase||S.phase;
  const pick=ui.hGame&&all().find(g=>g.id===ui.hGame);const list=pick?[pick]:all().filter(g=>g.ph===ph&&(!ui.hOwned||owned(g.id)));const mine=all().filter(g=>owned(g.id)),rest=all().filter(g=>!owned(g.id));
  return `<div class="grid g2"><section class="panel soft"><h2>As 7 regras da mesa</h2><ol class="rules">${RULES.map(r=>`<li><b>${r[0]}.</b> ${esc(r[1])}</li>`).join("")}</ol></section>
  <section class="panel"><h2>Frases de mesa, para qualquer jogo</h2><p class="small muted">Imprima ou deixe aberto no celular. Com estas 18 frases vocês já jogam uma partida inteira sem português.</p><ul class="clean phr two">${TABLE.map(phrase).join("")}</ul></section></div>
  <h2 style="margin-top:1.5rem">Como jogar cada jogo</h2>
  <div class="row" style="margin-bottom:.5rem"><div style="flex:1;min-width:240px;max-width:460px"><label for="hg">Jogo na mesa agora</label><select id="hg" data-chg="hgame" style="width:100%"><option value="">Ver todos da fase</option>${mine.length?`<optgroup label="Os que eu tenho">${mine.map(g=>`<option value="${esc(g.id)}" ${ui.hGame===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</optgroup>`:""}<optgroup label="Os outros">${rest.map(g=>`<option value="${esc(g.id)}" ${ui.hGame===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</optgroup></select></div></div>
  <div class="chips" ${pick?'hidden':''}>${PH.map(p=>`<button class="chip" aria-pressed="${ph===p.n}" data-act="hph" data-v="${p.n}">Fase ${p.n}</button>`).join("")}<button class="chip" aria-pressed="${!!ui.hOwned}" data-act="hown">Só os que eu tenho</button></div>
  ${list.map(g=>{const h=howOf(g),lad=ladder(g);return `<article class="how"><h3>${esc(g.name)} <span class="tag">${ROLE[g.role]}</span></h3>${lad?`<p class="next small"><b>Hoje — Sessão ${lad.n+1}.</b> ${esc(lad.rule)} ${esc(lad.goal)}${lad.example?` Exemplo: ${esc(lad.example)}`:""}</p>`:""}<p>${esc(h.how)}</p>${h.say.length?`<ul class="clean phr">${h.say.map(phrase).join("")}</ul>`:""}</article>`}).join("")||`<p class="muted">Nenhum jogo desta fase marcado como "Tenho". Desligue o filtro ou marque os jogos na aba de compras.</p>`}`;
}

function gref(id){const g=all().find(x=>x.id===id);if(!g)return"";const o=owned(id);return `<span class="chip ${o?"has":""}" style="cursor:default">${esc(g.name)}${o?", tenho":""}</span>`}
function vFases(){
  return `<section class="panel soft"><h2>Antes de culpar a fase: 5 perguntas</h2>
    <p class="small muted">Quase todo "não está funcionando" cai numa destas. Mude uma coisa por vez, mantenha por 2 semanas e só então reavalie. Se a dose estiver em dia por 8 a 12 semanas e ainda parecer que nada mudou, faça o EF SET: muitas vezes o progresso existe e só não é visível de dentro.</p>
    <ol class="rules">${CHECK5.map(c=>`<li><b>${c[0]}.</b> ${esc(c[1])}</li>`).join("")}</ol></section>
  <p class="small muted" style="margin:1rem 0 .4rem">As 13 fases do seu texto, agrupadas nas 5 fases do painel. As da fase atual abrem sozinhas.</p>
  ${STG.map(x=>`<details class="stg" ${x.ph===S.phase?"open":""}><summary><span class="num sn">${x.n}</span> ${esc(x.t)} <span class="tag">${x.lv}</span> <span class="tag">painel: fase ${x.ph}</span></summary>
    <div class="stgb"><p><b>O que está sendo construído.</b> ${esc(x.goal)}</p>
    <p><b>Jogos.</b></p><div class="chips">${x.g.map(gref).join("")}</div>
    ${x.extra.length?`<ul class="clean small">${x.extra.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:""}
    <p><b>Como jogar nesta fase.</b> ${esc(x.play)}</p>
    <p><b>Sinais de que funcionou.</b></p><ul class="ok">${x.ok.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
    <p><b>Se não funcionou.</b></p><div class="fixes">${x.fix.map(f=>`<div class="fix"><div class="sym">${esc(f[0])}</div><div>${esc(f[1])}</div></div>`).join("")}</div></div></details>`).join("")}`;
}

function vGuia(){
  const done=GSTART.filter((_,i)=>S.checks["g"+i]).length;
  return `<section class="panel soft"><h2>Primeiros 10 minutos</h2>
    <p class="small muted">Faça estes 6 passos uma vez, nesta ordem. ${done} de 6 feitos.</p>
    ${GSTART.map((g,i)=>`<div class="gstep"><label class="check"><input type="checkbox" ${S.checks["g"+i]?"checked":""} data-chg="chk" data-v="g${i}"><span><b>${i+1}. ${g[0]}.</b> ${esc(g[1])}</span></label>${g[2]?`<button class="chip" data-act="tab" data-v="${g[2]}">Abrir a aba</button>`:""}</div>`).join("")}</section>
  <h2 style="margin-top:1.5rem">A rotina, do dia ao trimestre</h2>
  <div class="grid g3">${GROUT.map(r=>`<div class="panel"><h3>${r[0]}</h3><p class="small">${esc(r[1])}</p></div>`).join("")}</div>
  <h2 style="margin-top:1.5rem">Aba por aba</h2>
  ${GTABS.map(t=>`<details class="stg"><summary>${t[1]} <span class="tag">${t[2]}</span></summary><div class="stgb"><p>${esc(t[3])}</p><ol class="rules">${t[4].map(x=>`<li>${esc(x)}</li>`).join("")}</ol><button class="btn ghost" data-act="tab" data-v="${t[0]}">Abrir ${t[1]}</button></div></details>`).join("")}
  <h2 style="margin-top:1.5rem">Dúvidas comuns</h2>
  <details class="stg"><summary>Onde ficam salvos os meus dados?</summary><div class="stgb"><p>Na sua conta, junto com este painel. O aviso no canto superior direito mostra Salvo na sua conta a cada mudança. Abrindo o mesmo link no celular e no computador com o seu login, os dados são os mesmos.</p></div></details>
  <details class="stg"><summary>A Raiana precisa de uma conta?</summary><div class="stgb"><p>Não. Vocês jogam na mesma mesa, então um aparelho só, com o seu login, resolve. O placar guarda os pontos dos dois.</p></div></details>
  <details class="stg"><summary>Marquei ou registrei algo errado</summary><div class="stgb"><p>Sessões, rodadas e provas têm o botão apagar ao lado. Apagar uma rodada corrige os totais sozinho. No meio de uma rodada, use Desfazer último toque. Situação e preço de um jogo você simplesmente troca.</p></div></details>

}

const intro=(t,p)=>`<div class="intro"><h2>${t}</h2><p>${p}</p></div>`;
const step=(n,t,h)=>`<div class="steph"><span class="sn num">${n}</span><div><h3>${t}</h3><p class="small muted">${h}</p></div></div>`;
function msg(){if(!ui.msg)return"";const m=ui.msg;ui.msg="";return `<p class="okmsg" role="status">${esc(m)}</p>`}
function nextAction(){
  const have=all().filter(g=>owned(g.id)).length,played=S.sessions.some(x=>x.d===today()),sg=suggest(),nb=nextBuy();
  if(!have)return{t:"Primeiro, diga ao painel quais jogos você já tem",p:"Sem isso ele não consegue montar a sua sessão. Na tela Comprar, mude a situação de cada jogo que já chegou para Tenho.",b:"Abrir Comprar",tab:"comprar"};
  if(!played)return{t:"Jogar a sessão de hoje",p:sg.main?`Jogo principal sugerido: ${sg.main.name}. Na tela Jogar você vê o aquecimento, as instruções e as frases em inglês.`:"Na tela Jogar você vê a sugestão de hoje, as instruções e as frases em inglês.",b:"Abrir Jogar",tab:"jogar"};
  return{t:"Sessão de hoje registrada",p:nb?`Próximo passo fora da mesa: comprar ${nb.name}.`:"Tudo desta fase já está comprado. Confira em Evoluir se já dá para subir de fase.",b:nb?"Abrir Comprar":"Abrir Evoluir",tab:nb?"comprar":"evoluir"};
}
function pWeek(){
  const wd=weekDays(),set=new Set(S.sessions.map(x=>x.d)),done=wd.filter(d=>set.has(iso(d))).length,t=today(),names=["seg","ter","qua","qui","sex","sáb","dom"];
  return `<section class="panel"><h3>Sua semana</h3><p class="small muted">Cada dia com sessão registrada fica verde. O dia de hoje tem borda escura.</p>
    <p><span class="big num">${done}</span> de ${S.goal} sessões</p>
    <div class="week">${wd.map((d,i)=>`<div class="day ${set.has(iso(d))?"on":""} ${iso(d)===t?"today":""}">${names[i]}<b>${d.getDate()}</b></div>`).join("")}</div>

const BOX=5;
function monOf(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function weekPts(k){const p=[0,0];S.rounds.forEach(r=>{if(monOf(r.d)===k){p[0]+=r.pts[0];p[1]+=r.pts[1]}});S.sessions.forEach(x=>{if((x.win===0||x.win===1)&&monOf(x.d)===k)p[x.win]+=BOX});return p}
function closeWeeks(){
  const now=monOf(today()),c=new Date(now+"T12:00:00");c.setDate(c.getDate()-56);const cut=iso(c),keys=new Set();let ch=false;
  S.rounds.forEach(r=>keys.add(monOf(r.d)));S.sessions.forEach(x=>{if(x.win===0||x.win===1)keys.add(monOf(x.d))});
  keys.forEach(k=>{if(k>=now)return;const o=S.weeks[k];if(o&&k<cut)return;const q=weekPts(k);if(!o||o.pts[0]!==q[0]||o.pts[1]!==q[1]){S.weeks[k]={pts:q};ch=true}});
  Object.keys(S.weeks).forEach(k=>{if(k>=cut&&!keys.has(k)){delete S.weeks[k];ch=true}});
  if(!Array.isArray(S.prizes)){S.prizes=[{id:"z1",name:"Escolhe o próximo jogo que vai para a mesa",cost:1},{id:"z2",name:"O outro paga o lanche",cost:2},{id:"z3",name:"Jantar por conta do outro",cost:4}];ch=true}
  return ch}
function league(){const rows=[],earned=[0,0];let carry=0;Object.keys(S.weeks).sort().forEach(k=>{const q=S.weeks[k].pts;let w=-1,g=0;if(q[0]!==q[1]){w=q[0]>q[1]?0:1;g=1+carry;earned[w]+=g;carry=0}else if(q[0]+q[1]>0)carry++;rows.push({k,q,w,g})});
  const spent=[0,0];S.redeem.forEach(r=>{spent[r.p]+=r.cost});return{rows,earned,carry,bal:[earned[0]-spent[0],earned[1]-spent[1]]}}
const brd=ds=>ds.split("-").reverse().slice(0,2).join("/");
const stars=n=>n===1?"1 estrela":n+" estrelas";
function pLeague(){
  const L=league(),k=monOf(today()),q=weekPts(k),left=6-(new Date().getDay()+6)%7,lead=q[0]===q[1]?-1:(q[0]>q[1]?0:1),prize=1+L.carry;

let S={rev:0,players:["Raí","Raiana"],phase:1,goal:5,games:{},custom:[],sessions:[],score:[0,0],wins:[0,0],round:[0,0],retired:0,tests:[],checks:{},deckData:{},cdecks:[],rounds:[],cur:null,hits:[0,0],miss:[0,0],retLegacy:null,weeks:{},prizes:null,redeem:[]};
const TABN={inicio:"Início",jogar:"Jogar",comprar:"Comprar",evoluir:"Evoluir",ajuda:"Ajuda"};
const DKOF=id=>BASE.some(a=>a[3]===id);

let sb=null, uid=null, saving=Promise.resolve(), pending=false, timer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const all=()=>CAT.concat(S.custom||[]);
const st=id=>(S.games[id]&&S.games[id].s)||"";

const last=id=>{const x=S.sessions.filter(x=>(x.g||[]).includes(id)).map(x=>x.d).sort().pop();return x||""};
const hours=()=>S.sessions.reduce((a,x)=>a+(+x.min||0),0)/60;

function setSync(t){$("#sync").textContent=t}
function save(){
  S.rev=(S.rev||0)+1;
  try{localStorage.setItem("mesa-ingles"+(uid?"-"+uid:""),JSON.stringify(S))}catch(e){}
  if(!sb||!uid){setSync("Salvo neste aparelho");return}
  pending=true;setSync("Salvando…");clearTimeout(timer);
  timer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));
    saving=saving.then(()=>sb.from("mesa_state").upsert({user_id:uid,data:body,updated_at:new Date().toISOString()})).then(r=>{pending=false;if(r.error)throw r.error;setSync("Salvo na nuvem")}).catch(()=>{pending=false;setSync("Sem conexão: salvo no aparelho, envio na próxima mudança")});
  },700);
}
function merge(d){if(!d)return;S=Object.assign(S,d);["games","checks","deckData","weeks"].forEach(k=>{if(!S[k]||typeof S[k]!=="object")S[k]={}});["custom","sessions","tests","cdecks","rounds","redeem"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!Array.isArray(S.players)||S.players.length!==2)S.players=["Raí","Raiana"];if(S.players[1]==="Dupla")S.players[1]="Raiana";["hits","miss","score","wins"].forEach(k=>{if(!Array.isArray(S[k])||S[k].length!==2)S[k]=[0,0]});if(S.retLegacy==null)S.retLegacy=+S.retired||0}
async function pull(){
  if(!sb||!uid||pending)return;
  const r=await sb.from("mesa_state").select("data").eq("user_id",uid).maybeSingle();
  if(r.error){setSync("Sem conexão: usando os dados do aparelho");return}
  if(r.data&&r.data.data&&(r.data.data.rev||0)>=(S.rev||0)){merge(r.data.data);render()}
  else if(S.rev>0)save();
  setSync("Salvo na nuvem");
}
function showApp(on){$("#gate").hidden=on;$("#app").hidden=!on}
async function enter(session){
  uid=session.user.id;showApp(true);
  $("#acct").innerHTML=`${esc(session.user.email||"")} <button data-act="logout">Sair</button>`;
  try{const l=localStorage.getItem("mesa-ingles-"+uid);if(l)merge(JSON.parse(l))}catch(e){}
  render();await pull();
}
async function login(){
  const em=$("#lem").value.trim(),pw=$("#lpw").value,err=$("#lerr"),bt=$("#lgo");
  if(!em||!pw){err.textContent="Preencha o e-mail e a senha.";return}
  bt.disabled=true;bt.textContent="Entrando…";err.textContent="";
  const r=await sb.auth.signInWithPassword({email:em,password:pw});
  bt.disabled=false;bt.textContent="Entrar";
  if(r.error){err.textContent=/invalid/i.test(r.error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar agora. Confira a conexão e tente de novo.";return}
  $("#lpw").value="";enter(r.data.session);
}
async function boot(){
  if(!SUPABASE_URL||!SUPABASE_KEY||!window.supabase){
    showApp(true);try{const l=localStorage.getItem("mesa-ingles");if(l)merge(JSON.parse(l))}catch(e){}
    render();setSync("Modo local: salvo só neste aparelho");return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  $("#lgo").addEventListener("click",login);
  $("#lpw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  $("#lshow").addEventListener("change",e=>{$("#lpw").type=e.target.checked?"text":"password"});
  const r=await sb.auth.getSession();
  if(r.data&&r.data.session)enter(r.data.session);else showApp(false);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
}
async function logout(){try{await saving}catch(e){}await sb.auth.signOut();uid=null;location.reload()}
async function changePw(){
  const a=$("#npw").value,b2=$("#npw2").value,out=$("#pwmsg");
  if(a.length<8){out.textContent="A senha precisa ter pelo menos 8 caracteres.";return}
  if(a!==b2){out.textContent="As duas senhas não são iguais.";return}
  const r=await sb.auth.updateUser({password:a});out.textContent=r.error?"Não foi possível trocar a senha agora.":"Senha trocada.";if(!r.error){$("#npw").value="";$("#npw2").value=""}
}
function exportData(){const bl=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="mesa-ingles-backup-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function importData(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||typeof d!=="object"||Array.isArray(d))throw 0;const keep=S.rev||0;merge(d);S.rev=Math.max(keep,d.rev||0);save();ui.msg="Dados importados.";ui.tab="inicio";render()}catch(e){ui.msg="Esse arquivo não é um backup válido do painel.";render()}};fr.readAsText(file)}

function weekDays(){const d=new Date();const off=(d.getDay()+6)%7;const m=new Date(d);m.setDate(d.getDate()-off);return[...Array(7)].map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x})}
function suggest(){
  const o=all().filter(g=>owned(g.id)&&g.ph<=S.phase);
  const by=(a,b)=>last(a.id).localeCompare(last(b.id));
  const warm=o.filter(g=>g.role==="A"||st(g.id)==="dominado").sort(by)[0];
  const main=o.filter(g=>g.role==="P"&&g.ph===S.phase&&st(g.id)==="tenho").sort(by)[0]||o.filter(g=>g.role==="P"&&st(g.id)==="tenho").sort(by)[0];
  const close=o.filter(g=>g.role==="C").sort(by)[0];
  return{warm,main,close,n:o.length};
}
function nextBuy(){return all().filter(g=>g.ph===S.phase&&(st(g.id)===""||st(g.id)==="lista")).sort((a,b)=>"PAC".indexOf(a.role)-"PAC".indexOf(b.role))[0]}
function nextOpen(){return all().find(g=>g.ph<=S.phase&&st(g.id)==="tenho"&&plays(g.id)===0)}
function readyForNew(){const m=all().filter(g=>g.ph===S.phase&&g.role==="P"&&st(g.id)==="tenho");return m.length>0&&m.every(g=>plays(g.id)>=6)}

      <li>Uma vez por mês, joguem uma rodada só com a pilha "já sei". A carta que alguém errar volta para o baralho.</li>
      <li>Sequência da semana: cartas novas no modo mais fácil da lista, depois o modo de produzir, e uma rodada de ouvir para fechar.</li>
      <li>Acima de 80% de acerto num baralho, é hora de colocar cartas novas.</li></ul></details>
  </section>
  <details class="stg"><summary>Placar geral e pilha "já sei"</summary><div class="stgb">
    <div class="score">${[0,1].map(i=>{const t=(S.hits[i]||0)+(S.miss[i]||0);return `<div><h3>${esc(S.players[i])}</h3><p><span class="big num">${S.score[i]||0}</span> pontos</p><p class="small muted">${S.wins[i]||0} rodadas vencidas${t?`, ${pctOf(S.hits[i],t)}% de acerto`:""}</p></div>`}).join("")}</div>
    <h3 style="margin-top:.8rem">Cartas na pilha "já sei"</h3><p><span class="big num">${ra}</span> de 1000</p><div class="bar" aria-hidden="true"><i style="width:${Math.min(100,ra/10)}%"></i></div>
    <p class="small muted">São as cartas que saíram dos baralhos porque vocês dois já sabem de cor. É o seu vocabulário ativo de verdade.</p>
    ${ui.confirmReset?`<div class="row"><button class="btn" style="background:var(--stop);border-color:var(--stop)" data-act="reset2">Confirmar: zerar placar e rodadas</button><button class="btn ghost" data-act="resetno">Cancelar</button></div>`:`<button class="link" data-act="reset">Zerar placar geral</button>`}
  </div></details></div>
  <details class="stg" style="margin-top:.6rem"><summary>Meus baralhos: acerto, progresso e total de cartas</summary><div class="stgb">
    <div class="dtable">${groups(D).map(g=>`<h3 style="margin-top:1rem">${esc(g.n)}</h3>`+g.items.map(x=>{const i=dd(x.id),r=S.rounds.filter(y=>y.deck===x.id),hh=r.reduce((a,y)=>a+y.hit[0]+y.hit[1],0),mm=r.reduce((a,y)=>a+y.miss[0]+y.miss[1],0);return `<div class="drow"><div><b>${esc(x.name)}</b><br><span class="small muted">${KIND[x.kind]||"Palavras"}, ${r.length} rodadas${hh+mm?`, ${pctOf(hh,hh+mm)}% de acerto`:""}${x.cu?` <button class="link" data-act="deldeck" data-v="${esc(x.id)}">remover</button>`:""}</span>
      ${i.total?`<div class="bar" aria-hidden="true"><i style="width:${Math.min(100,pctOf(i.ret,i.total))}%"></i></div>`:""}</div>
      <div class="row" style="gap:.4rem"><div><label>Já sei</label><input type="number" min="0" value="${i.ret}" data-chg="dret" data-v="${esc(x.id)}" style="width:84px" aria-label="Cartas aposentadas de ${esc(x.name)}"></div><div><label>Total</label><input type="number" min="0" value="${i.total||""}" placeholder="?" data-chg="dtot" data-v="${esc(x.id)}" style="width:84px" aria-label="Total de cartas de ${esc(x.name)}"></div></div></div>`}).join("")).join("")}</div>
    <p class="small muted">Os baralhos recomendados já vêm configurados, mesmo antes de chegarem. Os totais da SuperMente são estimativas de 50 cartas por caixa: ajuste o número quando abrir cada uma. Nos jogos de memória, conte as cartas e preencha o total para a barra de progresso aparecer.</p>
    <div class="row" style="margin-top:.6rem"><div style="flex:1;min-width:200px"><label for="dn">Novo baralho</label><input id="dn" style="width:100%" placeholder="ex.: Cartas do Monopoly"></div>
    <div><label for="dkk">Tipo</label><select id="dkk"><option value="img">Palavras com imagem</option><option value="freq">Palavras sem imagem</option><option value="frase">Frases</option></select></div>
    <button class="btn" data-act="adddeck">Criar baralho</button></div>
  </div></details>
  <details class="stg"><summary>Últimas rodadas</summary><div class="stgb">
    ${S.rounds.length?`<ul class="clean">${S.rounds.slice().reverse().slice(0,10).map(r=>{return `<li><b>${esc(r.d.split("-").reverse().join("/"))}</b>, ${esc(dname(r.deck))}${r.block?`, bloco ${r.block}`:""} <span class="tag">${(MODES[r.mode]||[""])[0]}</span><br><span class="small muted">${esc(S.players[0])} ${r.pts[0]} x ${r.pts[1]} ${esc(S.players[1])}${r.ret?`, ${r.ret} cartas para a pilha já sei`:""}</span> <button class="link" data-act="delround" data-v="${esc(r.k)}">apagar</button></li>`}).join("")}</ul>`:`<p class="muted">Nenhuma rodada encerrada ainda. Escolha o baralho acima e comece.</p>`}
  </div></details>`;
}

function vNivel(){
  const p=PH[S.phase-1],ch=p.gate.map((_,i)=>!!S.checks[p.n+"-"+i]),ok=ch.every(Boolean),h=hours();
  return `<div class="grid g2"><section class="panel">
    <h2>Posso passar para a fase ${Math.min(5,p.n+1)}?</h2>
    <p class="muted small">Fase atual: ${p.n}, ${p.t} (${p.lv}). Marque só o que já acontece na mesa sem esforço.</p>
    ${p.gate.map((g,i)=>`<label class="check"><input type="checkbox" ${ch[i]?"checked":""} data-chg="chk" data-v="${p.n}-${i}"><span>${esc(g)}</span></label>`).join("")}
    <ul class="clean small" style="margin:.6rem 0">
      <li>Horas na mesa: <b>${h.toFixed(1).replace(".",",")} h</b>. Referência da fase: cerca de ${p.h} h acumuladas.</li>
      <li>Faixa esperada na prova: <b>${p.band}</b>.</li></ul>
    <div class="row"><button class="btn" data-act="up" ${ok&&p.n<5?"":"disabled"}>Passar para a fase ${Math.min(5,p.n+1)}</button>${p.n>1?`<button class="btn ghost" data-act="down">Voltar uma fase</button>`:""}</div>
    ${ok?"":`<p class="small muted">O botão libera quando os ${p.gate.length} itens estiverem marcados.</p>`}
  </section>
  <section class="panel soft"><h2>Prova: faço ou não faço?</h2>
    <p><b>Faça, mas não estude para ela.</b> A prova é um termômetro do que os jogos já ensinaram. Estudar para a prova estraga a medição e traz de volta o formato que nunca funcionou para você.</p>
    <ul class="clean">
      <li><b>Agora:</b> EF SET Quick Check, 15 min, grátis. Só para registrar o ponto de partida. As perguntas são sempre as mesmas, então não repita.</li>
      <li><b>A cada 3 meses:</b> EF SET de 50 min, grátis, com nota de 0 a 100 na escala A1 a C2. É adaptativo, então dá para repetir.</li>
      <li><b>Limite:</b> essas provas medem leitura e escuta. Fala não entra. Quem avalia sua fala é o professor: peça a ele um nível a cada 3 meses.</li>
      <li><b>Prova oficial paga</b> (IELTS, TOEFL, Cambridge): só quando precisar do certificado para visto, trabalho ou estudo.</li></ul>
    <p class="row" style="margin-top:.6rem"><a class="btn ghost" href="https://www.efset.org/" target="_blank" rel="noopener">Abrir o EF SET</a></p>
  </section></div>
  <section class="panel" style="margin-top:1rem"><h2>Minhas provas</h2>
    <div class="row"><div><label for="td">Data</label><input type="date" id="td" value="${today()}"></div>
    <div><label for="tn">Prova</label><select id="tn"><option>EF SET 50 min</option><option>EF SET Quick Check</option><option>Avaliação do professor</option><option>Outra</option></select></div>
    <div><label for="tr">Resultado</label><input id="tr" placeholder="ex.: 34, A2"></div>
    <button class="btn" data-act="addtest">Registrar prova</button></div>
    ${S.tests.length?`<ul class="clean" style="margin-top:.6rem">${S.tests.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(t=>`<li><b>${esc(t.d.split("-").reverse().join("/"))}</b>, ${esc(t.n)}: ${esc(t.r)} <button class="link" data-act="deltest" data-v="${esc(t.k)}">apagar</button></li>`).join("")}</ul>`:`<p class="muted small" style="margin-top:.6rem">Nenhuma prova registrada. A primeira define seu ponto de partida.</p>`}
  </section>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;let persist=true;
  if(a==="logout"){logout();return}
  if(a==="chpw"){changePw();return}
  if(a==="export"){exportData();return}
  if(a==="tab"){ui.tab=v;ui.touched=true;persist=false;ui.jump=true}
  else if(a==="smin"){ui.sMin=+v;persist=false}
  else if(a==="jmode"){ui.jmode=v;persist=false}
  else if(a==="swin"){ui.sWin=+v;persist=false}
  else if(a==="openg"){ui.tab="jogar";ui.jmode="caixa";ui.hGame=v;persist=false;ui.jumpTo="#hg"}
  else if(a==="openf"){ui.tab="jogar";ui.jmode="flash";persist=false;ui.jumpTo="#cdk"}
  else if(a==="sgame"){ui.sGames[v]=!ui.sGames[v];persist=false}
  else if(a==="fph"){ui.fPhase=+v;persist=false}
  else if(a==="fmiss"){ui.fMissing=!ui.fMissing;persist=false}
  else if(a==="hph"){ui.hPhase=+v;persist=false}
  else if(a==="hown"){ui.hOwned=!ui.hOwned;persist=false}
  else if(a==="say"){speak(v);return}
  else if(a==="sayPT"){speakPT(v,b);return}
  else if(a==="selgame"){ui.hGame=ui.hGame===v?null:v;persist=false}
  else if(a==="addsess"){S.sessions.push({k:"s"+Date.now(),d:ui.sDate||today(),min:ui.sMin,win:ui.sWin==null?-1:ui.sWin,g:Object.keys(ui.sGames).filter(k=>ui.sGames[k])});ui.sWin=-1;if(S.sessions.length>600)S.sessions=S.sessions.slice(-600);ui.sGames={};ui.msg="Sessão registrada. A semana e as horas já foram atualizadas.";ui.tab="inicio";ui.jump=true}
  else if(a==="delsess"){S.sessions=S.sessions.filter(x=>x.k!==v)}
  else if(a==="addgame"){const n=$("#cn").value.trim();if(!n)return;S.custom.push({id:"x"+Date.now(),name:n.slice(0,80),ph:+$("#cp").value,role:$("#cr").value,src:"",en:true,q:n,note:"",cu:true})}
  else if(a==="delgame"){S.custom=S.custom.filter(g=>g.id!==v);delete S.games[v]}
  else if(a==="mode"){cur().mode=v}
  else if(a==="tap"){const c=cur(),i=c.turn||0;if(c.log.length>=(c.len||20))return;c.p[i][v]++;c.log.push([i,v]);c.turn=1-i;ui.tEnd=0;if(c.log.length>=(c.len||20))ui.jumpTo="#roundbox"}
  else if(a==="undo"){const c=cur(),l=c.log.pop();if(l){c.p[l[0]][l[1]]=Math.max(0,c.p[l[0]][l[1]]-1);c.turn=l[0]}}
  else if(a==="zero"){const c=cur();c.p=[zero(),zero()];c.log=[];c.turn=0}
  else if(a==="timer"){ui.tEnd=Date.now()+10000;persist=false}
  else if(a==="endround"){const c=cur(),P=[pts(c.p[0]),pts(c.p[1])],H=[hit(c.p[0]),hit(c.p[1])],M=[c.p[0].x,c.p[1].x],rt=Math.max(0,Math.min(200,+$("#rret").value||0));
    S.rounds.push({k:"r"+Date.now(),d:today(),deck:c.deck,mode:c.mode,block:d0blk(c),pts:P,hit:H,miss:M,ret:rt});if(S.rounds.length>300)S.rounds=S.rounds.slice(-300);
    [0,1].forEach(i=>{S.score[i]=(S.score[i]||0)+P[i];S.hits[i]=(S.hits[i]||0)+H[i];S.miss[i]=(S.miss[i]||0)+M[i]});if(P[0]!==P[1]){const w=P[0]>P[1]?0:1;S.wins[w]=(S.wins[w]||0)+1}
    if(rt){const o=dd(c.deck);S.deckData[c.deck]=Object.assign({},S.deckData[c.deck],{ret:o.ret+rt})}
    c.p=[zero(),zero()];c.log=[];c.turn=0;const wq=weekPts(monOf(today()));ui.rmsg="Rodada salva. Disputa da semana: "+S.players[0]+" "+wq[0]+" x "+wq[1]+" "+S.players[1]+".";ui.jumpTo="#roundbox"}
  else if(a==="delround"){const r=S.rounds.find(x=>x.k===v);if(r){[0,1].forEach(i=>{S.score[i]=Math.max(0,(S.score[i]||0)-r.pts[i]);S.hits[i]=Math.max(0,(S.hits[i]||0)-r.hit[i]);S.miss[i]=Math.max(0,(S.miss[i]||0)-r.miss[i])});if(r.pts[0]!==r.pts[1]){const w=r.pts[0]>r.pts[1]?0:1;S.wins[w]=Math.max(0,(S.wins[w]||0)-1)}
    if(r.ret&&S.deckData[r.deck])S.deckData[r.deck].ret=Math.max(0,(S.deckData[r.deck].ret||0)-r.ret);S.rounds=S.rounds.filter(x=>x.k!==v)}}
  else if(a==="adddeck"){const n=$("#dn").value.trim();if(!n)return;const id="d"+Date.now();S.cdecks.push({id:id,name:n.slice(0,60),kind:$("#dkk").value});cur().deck=id}
  else if(a==="deldeck"){S.cdecks=S.cdecks.filter(x=>x.id!==v);delete S.deckData[v]}
  else if(a==="addprize"){const n=$("#zn").value.trim();if(!n)return;S.prizes.push({id:"z"+Date.now(),name:n.slice(0,80),cost:+$("#zc").value||1})}
  else if(a==="delprize"){S.prizes=S.prizes.filter(z=>z.id!==v)}
  else if(a==="redeem"){const z=S.prizes.find(x=>x.id===v),i=+b.dataset.p;if(!z||league().bal[i]<z.cost)return;S.redeem.push({k:"e"+Date.now(),d:today(),p:i,name:z.name,cost:z.cost});ui.msg=S.players[i]+" trocou "+stars(z.cost)+" por: "+z.name+".";ui.jump=true}
  else if(a==="delredeem"){S.redeem=S.redeem.filter(r=>r.k!==v)}
  else if(a==="reset"){ui.confirmReset=true;persist=false}
  else if(a==="resetno"){ui.confirmReset=false;persist=false}
  else if(a==="reset2"){S.score=[0,0];S.wins=[0,0];S.hits=[0,0];S.miss=[0,0];S.rounds=[];ui.confirmReset=false}
  else if(a==="up"){if(S.phase<5)S.phase++}
  else if(a==="down"){if(S.phase>1)S.phase--}
  else if(a==="addtest"){const r=$("#tr").value.trim();if(!r)return;S.tests.push({k:"t"+Date.now(),d:$("#td").value||today(),n:$("#tn").value,r:r.slice(0,40)})}
  else if(a==="deltest"){S.tests=S.tests.filter(t=>t.k!==v)}
  if(persist)save();render();
  if(ui.jump){ui.jump=false;try{window.scrollTo(0,0)}catch(e){}}
  if(ui.jumpTo){const q=ui.jumpTo;ui.jumpTo="";try{const n=$(q);if(n)window.scrollTo(0,n.getBoundingClientRect().top+window.scrollY-90)}catch(e){}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="impf"&&e.target.files[0]){importData(e.target.files[0]);return}
  const el=e.target.closest("[data-chg]");if(!el)return;const c=el.dataset.chg,v=el.dataset.v;
  if(c==="sdate"){ui.sDate=el.value;return}
  if(c==="goal")S.goal=+el.value;
  else if(c==="gst"){S.games[v]=Object.assign({},S.games[v],{s:el.value})}
  else if(c==="gpr"){S.games[v]=Object.assign({},S.games[v],{p:Math.max(0,+el.value||0)})}
  else if(c==="pname"){S.players[+v]=el.value.trim().slice(0,24)||("Jogador "+(+v+1))}
  else if(c==="chk"){S.checks[v]=el.checked}
  else if(c==="curdeck"){cur().deck=el.value;cur()}
  else if(c==="curblock"){cur().block=+el.value}
  else if(c==="curlen"){cur().len=+el.value}
  else if(c==="dret"){S.deckData[v]=Object.assign({},S.deckData[v],{ret:Math.max(0,Math.round(+el.value||0))})}
  else if(c==="dtot"){S.deckData[v]=Object.assign({},S.deckData[v],{total:Math.max(0,Math.round(+el.value||0))})}
  else if(c==="hgame"){ui.hGame=el.value;render();return}
  save();render();
});
setInterval(()=>{const e=$("#tleft");if(!e||!ui.tEnd)return;const l=Math.ceil((ui.tEnd-Date.now())/1000);if(l<=0){ui.tEnd=0;e.textContent="Tempo!";}else e.textContent=l},250);
boot();
</script>
